  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            teal: {

              100: '#ccfbf1',
              200: '#99f6e4',
              300: '#5eead4',

              800: '#115e59',

            navy: {

              900: '#0f172a',
              950: '#0a0f1d'

          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }

  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#f6f9f8] text-slate-800 min-h-screen flex flex-col font-sans selection:bg-teal-100 selection:text-teal-900">

    <div class="flex-1 flex items-center justify-center py-20">
      <div class="text-center space-y-3">
        <div class="w-12 h-12 rounded-2xl bg-teal-600 animate-spin mx-auto flex items-center justify-center text-white">

        </div>
        <p class="text-xs font-bold text-slate-500 uppercase tracking-widest">Loading RENEW Healthcare Suite...</p>

    </div>

  <script src="app.js"></script>
